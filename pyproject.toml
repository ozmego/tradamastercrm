[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tradecrm"
version = "0.1.0"
description = "Kripto spot trading botu (Binance / ccxt)"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "ccxt>=4.3",
    "pandas>=2.2",
    "pandas_ta>=0.3.14b0",
    "backtesting>=0.3.3",
    "pydantic-settings>=2.4",
    "requests>=2.32",
    "APScheduler>=3.10",
    "typer>=0.12",
    "sqlmodel>=0.0.21",
    "psycopg[binary]>=3.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-mock>=3.14",
    "responses>=0.25",
    "freezegun>=1.5",
    "ruff>=0.6",
    "httpx>=0.27",
]

[project.scripts]
tradecrm = "tradecrm.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tradecrm = ["data/*.csv", "api/static/*", "api/static/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI bagimlilik enjeksiyonu: Depends/Query/Header varsayilan arguman olarak kullanilir.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header", "fastapi.params.Depends"]
