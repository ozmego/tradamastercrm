services:
  postgres:
    image: postgres:16
    container_name: tradecrm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tradecrm
      POSTGRES_PASSWORD: tradecrm
      POSTGRES_DB: tradecrm
    ports:
      - "5434:5432"
    volumes:
      - tradecrm_pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradecrm -d tradecrm"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tradecrm_pgdata:
